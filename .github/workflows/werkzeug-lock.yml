name: Lock-Dateien der Programmier-Werkzeuge

# Erzeugt mit `node tools/werkzeug-lock.mjs` die Lock-Dateien für Codex, Gemini CLI und OpenCode (feste Versionen aus
# desktop/dienst/lib/werkzeuge.mjs, nur registry.npmjs.org, sha512 je Paket, ohne Skripte – npm lädt nur die Paket-Angaben).
# Start: von Hand (Actions › „Lock-Dateien der Programmier-Werkzeuge“ › Run workflow – erst sichtbar, wenn der Ablauf auf main liegt) oder per push
# auf feature/werkzeug-wahl, wenn tools/werkzeug-lock.mjs oder tools/werkzeug-lock.anfordern geändert wurde (Zeitstempel ändern = neu anfordern).
# Nie auf main/live. Der eigene Commit (nur desktop/dienst/werkzeuge/*/package-lock.json) löst ihn nicht erneut aus: Pfad-Filter + Prüfung des Auslösers.
# Ergebnis: Artefakt „werkzeug-lock“ (7 Tage) und – wenn gewählt – ein Commit auf den gewählten Zweig. Die Dateien gehören ins Review.
on:
  push:
    branches: ['feature/werkzeug-wahl']
    paths:
      - 'tools/werkzeug-lock.mjs'
      - 'tools/werkzeug-lock.anfordern'
      - '!desktop/dienst/werkzeuge/**'
  workflow_dispatch:
    inputs:
      committen:
        description: "Lock-Dateien zusätzlich auf diesen Zweig committen (sonst nur Artefakt)"
        type: boolean
        default: true

permissions:
  contents: write            # nur für den Commit der Lock-Dateien auf den Arbeitszweig

jobs:
  lock:
    # Nie durch den eigenen Commit (Bot) erneut auslösen
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04   # fest wie „Prüfung“
    timeout-minutes: 15
    steps:
      - name: Nicht auf main oder live
        if: github.ref_name == 'main' || github.ref_name == 'live'
        run: |
          echo "Bitte auf einem Arbeitszweig starten (z. B. feature/werkzeug-wahl), nicht auf ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - name: Lock-Dateien erzeugen
        run: |
          node --version
          node tools/werkzeug-lock.mjs
          git status --short desktop/dienst/werkzeuge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: werkzeug-lock
          path: desktop/dienst/werkzeuge/*/package-lock.json
          retention-days: 7
          if-no-files-found: error
      - name: Auf den Zweig committen
        if: github.event_name == 'push' || inputs.committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/dienst/werkzeuge/*/package-lock.json
          if git diff --cached --quiet; then echo "Keine Änderung – Lock-Dateien sind schon aktuell."; exit 0; fi
          git commit -m "Lock-Dateien der Programmier-Werkzeuge erzeugt (Ablauf „Lock-Dateien der Programmier-Werkzeuge“)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
